<script>
  const statusElement = document.getElementById("discord-status");
  const userId = "1515687001314295899";

  async function updateDiscordStatus() {
    try {
      const response = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
      if (!response.ok) throw new Error("Status request failed");

      const result = await response.json();
      if (!result.success) throw new Error("Status unavailable");

      const status = result.data.discord_status;
      const customStatus = result.data.activities.find(activity => activity.type === 4);
      const customText = customStatus?.state;
      const labels = {
        online: "Online",
        idle: "Idle",
        dnd: "Do Not Disturb",
        offline: "Offline"
      };

      statusElement.textContent =
        `Discord: ${labels[status] ?? "Unknown"}` +
        (customText ? ` — ${customText}` : "");
    } catch (error) {
      statusElement.textContent = "Discord status unavailable";
      console.error(error);
    }
  }

  updateDiscordStatus();
  setInterval(updateDiscordStatus, 30000); // updates like every 30 seconds probably
// gets current status on el cord
</script>
